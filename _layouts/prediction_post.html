---
layout: article_layout
---

<article class="post">
    <h1>{{ page.title }}</h1>

    <div class="date">
        {{ page.date | date: "%B %e, %Y" }}
    </div>

    <div class="entry prediction">
        {{ content }}
    </div>

    <nav class="post-nav">
        <a href="{{ site.baseurl }}/">&larr; Blog</a>
    </nav>

    {% include disqus.html %}
</article>
