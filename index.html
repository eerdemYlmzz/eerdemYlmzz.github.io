---
layout: default
---

<ul class="post-list">
  {% for post in site.posts %}
    <li class="post-list-item">
      <span class="post-list-date">{{ post.date | date: "%d %b %Y" }}</span>
      <a class="post-list-title" href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
